# ==============================================================================
# Bulk RNA-seq Pipeline - EXAMPLE/DEMO Configuration
# ==============================================================================
#
# This config uses synthetic example data to demonstrate the pipeline.
# It skips alignment/counting stages and runs DESeq2 + pathway analysis.
#
# Usage:
#   ./scripts/run_pipeline.sh --config config/config_example.yaml
#   OR
#   DEMO_MODE=true ./scripts/run_pipeline.sh
#
# ==============================================================================

# ------------------------------------------------------------------------------
# DEMO MODE FLAG
# ------------------------------------------------------------------------------

demo_mode: true

# ------------------------------------------------------------------------------
# GLOBAL: Reference genome and annotation (not used in demo mode)
# ------------------------------------------------------------------------------

global:
  genome_build: "GRCh38"
  gencode_version: "v38"
  org_db: "org.Hs.eg.db"
  txdb: "TxDb.Hsapiens.UCSC.hg38.knownGene"


# ------------------------------------------------------------------------------
# PATHS: Directory structure
# ------------------------------------------------------------------------------

paths:
  # Reference files (not used in demo mode)
  references:
    fasta: "data/references/GRCh38.primary_assembly.fa"
    gtf: "data/references/gencode.v38.annotation.gtf"
    star_index: "data/references/star_index"

  reference_urls:
    fasta: "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_38/GRCh38.primary_assembly.genome.fa.gz"
    gtf: "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_38/gencode.v38.annotation.gtf.gz"

  # Raw data (not used in demo mode)
  raw_data:
    fastq_rnaseq: "data/fastq/rnaseq"

  # DEMO: Use example data
  metadata:
    rnaseq: "example_data/metadata_example.tsv"

  # DEMO: Pre-computed counts (skips alignment)
  example_counts: "example_data/counts_example.tsv"

  # Pipeline outputs
  results: "results"
  logs: "logs"


# ------------------------------------------------------------------------------
# BULK RNA-SEQ: Analysis parameters
# ------------------------------------------------------------------------------

bulk_rnaseq:
  alignment:
    strandedness: "unstranded"
    star_threads: 8

  quantification:
    feature_type: "exon"
    attribute_type: "gene_id"

  qc:
    min_alignment_rate: 0.70
    min_mapped_reads: 1000000

  de:
    min_counts: 10
    fdr_threshold: 0.05
    lfc_threshold: 1.0


# ------------------------------------------------------------------------------
# CONTRASTS: Experimental comparisons
# ------------------------------------------------------------------------------

contrasts:
  rnaseq:
    - name: "cisplatin_vs_vehicle"
      numerator: "cisplatin"
      denominator: "vehicle"


# ------------------------------------------------------------------------------
# MARKER GENES: Genes of interest for expression plots
# ------------------------------------------------------------------------------

marker_genes:
  immune:
    - IFIT1
    - ISG15
    - MX1
    - OAS1
    - RSAD2

  cytotoxic:
    - GZMB
    - PRF1
    - NKG7

  apoptosis:
    - BAX
    - BCL2
    - CASP3

  custom:
    - GAPDH
    - ACTB
